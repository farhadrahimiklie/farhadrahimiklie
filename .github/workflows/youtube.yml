name: Update YouTube Videos

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: UC_8VaDaVHm7ZQbsDU8AXBHw
          readme_path: README.md
          max_videos: 6
